# Replace this example node with your own before use.
[General]
dns-server = system

[Proxy]
Example = trojan, proxy.example.com, 443, password=replace-with-your-password, sni=proxy.example.com

[Proxy Group]
Proxies = select, Example
AI = select, Proxies, Example

[Rule]
# Keep your actual VPN endpoint DIRECT exceptions here.
DOMAIN,proxy.example.com,DIRECT
RULE-SET,https://raw.githubusercontent.com/Jinx-1120/clash_rules/main/LocalAreaNetwork.list,DIRECT,update-interval=3600
RULE-SET,https://raw.githubusercontent.com/Jinx-1120/clash_rules/main/no_proxy.list,DIRECT,update-interval=3600
RULE-SET,https://raw.githubusercontent.com/Jinx-1120/clash_rules/main/ai.list,AI,update-interval=3600
RULE-SET,https://raw.githubusercontent.com/Jinx-1120/clash_rules/main/ai-shared.list,AI,update-interval=3600
#!MACOS-ONLY RULE-SET,https://raw.githubusercontent.com/Jinx-1120/clash_rules/main/ai-process-surge.list,AI,update-interval=3600
RULE-SET,https://raw.githubusercontent.com/Jinx-1120/clash_rules/main/proxy.list,Proxies,update-interval=3600
FINAL,Proxies
